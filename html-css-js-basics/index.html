<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Hello, World!</h1>
    <h4>Hello</h4>
    <div>안녕하세요</div>

    <nav>
      <p>1</p>
    </nav>

    <h3>ol/li</h3>
    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ol>

    <section>
      <form>
        <p>
          <label for="name">이름:</label>
          <input id="name" type="text" placeholder="이름을 입력하세요" />
        </p>
        <p>
          <label for="message">메시지:</label>
          <textarea
            id="message"
            rows="4"
            cols="30"
            placeholder="하고 싶은 말을 작성하세요"
          ></textarea>
        </p>
        <button type="submit">전송</button>
      </form>
    </section>
  </body>
</html>
